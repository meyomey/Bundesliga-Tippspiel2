name: Tests & Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Flake8 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Flake8 installieren
        run: pip install flake8
      - name: "Harter Gate: Syntaxfehler & undefinierte Namen"
        run: |
          flake8 . --exclude=.venv,htmlcov,__pycache__,.pytest_cache --count \
            --select=E9,F63,F7,F82 --show-source --statistics
      - name: Style-Statistik (kein Gate, nur Bericht)
        run: |
          flake8 . --exclude=.venv,htmlcov,__pycache__,.pytest_cache --count \
            --exit-zero --max-complexity=10 --statistics

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Produktionsversion auf Netcup/Plesk (seit 13.10.2026, (121));
        # 3.12/3.13 = Abwaertskompatibilitaet nach vorn
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Testsuite
        run: python -m pytest -q

  js:
    name: JS-Engine-Tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: "Tipp-Optimizer-Engine (static/js/to_engine.js)"
        run: node tests/js/tip_optimizer_engine_test.js
      - name: "Dashboard-Tagesmarkierung (static/js/dash_days.js)"
        run: node tests/js/dash_days_test.js
      - name: "Theme-Umschalter (static/js/theme.js)"
        run: node tests/js/theme_test.js

  audit:
    name: Security Audit (pip-audit)
    runs-on: ubuntu-latest
    # (126): bewusst OHNE Ignore-Liste - seit dem Python-3.11-Floor sind
    # alle Pins auf gepatchten Versionen (lokal verifiziert: "No known
    # vulnerabilities found"). Neue Advisories machen den Job ROT = hartes
    # Gate statt Stille.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: pip-audit installieren
        run: pip install pip-audit
      - name: Audit requirements.txt
        run: pip-audit -r requirements.txt
