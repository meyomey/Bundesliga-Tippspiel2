# (127) Dependabot: woechentliche Update-Vorschlaege als Pull Requests.
#
# Zwei Oekosysteme:
#   pip            -> requirements.txt (App-Abhaengigkeiten)
#   github-actions -> .github/workflows/* (Action-Versionen wie checkout@v5)
#
# Jeder Vorschlag laeuft durch die komplette CI (pytest-Matrix 3.11-3.13,
# flake8-Hartgate, Node-Tests, pip-audit als hartes Gate) — nur gruen
# mergen. Zusätzlich empfohlen (Repo-Settings, einmalig klicken):
#   Settings -> Code security and analysis ->
#   - "Dependabot alerts" AN (public repo: meist schon an)
#   - "Dependabot security updates" AN (oeffnet Fix-PRs automatisch)
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
